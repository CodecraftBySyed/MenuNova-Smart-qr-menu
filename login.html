<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
    <title>Admin Login – MenuNova</title>
    <link rel="stylesheet" href="./src/output.css?v=2">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen page-fade">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md fade-in">
        <div class="flex justify-center mb-4">
            <img src="./images/logo.png" alt="MenuNova Logo" class="w-30 h-30 rounded-full object-cover" id="loginLogo">
        </div>
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Admin Login</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">User Name</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition" 
                       id="email" type="text" placeholder="eg : admin..." required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition" 
                       id="password" type="password" placeholder="********" required>
            </div>
            
            <div id="errorMsg" class="text-red-500 text-sm hidden text-center"></div>

            <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-300 transition duration-300" 
                    type="submit">
                Sign In
            </button>
        </form>
    </div>

    <!-- CDN: SweetAlert2 and anime.js -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
